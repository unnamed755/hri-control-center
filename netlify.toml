# Fallback host, kept in sync with vercel.json.
[build]
  command = "vite build"
  publish = "dist"

# Client-side routing: every unknown path is served by the SPA shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
